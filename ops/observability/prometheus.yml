# Scrape configuration for the local stack.
#
# Static targets rather than service discovery: compose gives every container a stable DNS
# name, so discovery would be machinery with nothing to discover. In Kubernetes this file is
# replaced by a ServiceMonitor or by the prometheus.io/* pod annotations in deploy/k8s.
global:
  scrape_interval: 10s
  scrape_timeout: 5s
  evaluation_interval: 15s
  external_labels:
    env: local
    platform: oms

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: oms-services
    # Spring Boot Actuator does not serve metrics at /metrics; Micrometer's Prometheus
    # endpoint is under the actuator base path.
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels: { service: api-gateway }
      - targets: ["order-service:8081"]
        labels: { service: order-service }
      - targets: ["matching-engine:8082"]
        labels: { service: matching-engine }
      - targets: ["market-data-service:8083"]
        labels: { service: market-data-service }
      - targets: ["position-service:8084"]
        labels: { service: position-service }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
