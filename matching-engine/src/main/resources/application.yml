spring:
  application:
    name: matching-engine

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    consumer:
      group-id: matching-engine
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      # The engine drives its own acknowledgement timing through batch listeners, so the
      # container commits after the batch handler returns - which is after every trade in that
      # batch has been acknowledged by the broker. See EventPublisher.
      ack-mode: batch
      missing-topics-fatal: false

server:
  port: 8082
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
      group:
        readiness:
          # No database to check. The engine is ready when it can reach Kafka, because
          # without Kafka it has no input and no way to publish a fill.
          include: ping
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      # Export real percentiles for the matching timer rather than a mean. A latency mean is
      # close to useless and a p99 cannot be recovered from it afterwards.
      percentiles-histogram:
        oms.engine.match: true
      percentiles:
        oms.engine.match: 0.5,0.95,0.99,0.999
      slo:
        oms.engine.match: 1us,5us,10us,50us,100us,500us,1ms

oms:
  engine:
    # Price levels per side in a published snapshot.
    snapshot-depth: 10
    # Recently-seen order ids remembered per book, for at-least-once deduplication.
    dedupe-capacity: 65536
    # Order nodes retained per book for reuse. 0 disables pooling.
    node-pool-limit: 4096
    # Consumer threads = books matched in parallel. Capped by the partition count (12).
    concurrency: 3
    consumer-group: matching-engine
    metrics-refresh-interval: 5000

logging:
  level:
    root: INFO
    com.oms: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
