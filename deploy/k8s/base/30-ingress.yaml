# The only route into the cluster. Everything else is ClusterIP plus a NetworkPolicy.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: oms-platform
  namespace: oms
  annotations:
    # TLS terminates here. The gateway speaks plain HTTP inside the cluster; service-to-service
    # encryption is a service-mesh concern (mTLS), noted as not-done in docs/security.md.
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # SSE needs a long read timeout and buffering off, or the proxy holds the stream and
    # releases it in chunks - which defeats the point of a streaming endpoint.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["oms.example.com"]
      secretName: oms-tls
  rules:
    - host: oms.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port: { number: 8080 }
