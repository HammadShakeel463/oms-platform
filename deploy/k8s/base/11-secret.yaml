# =====================================================================================
#  PLACEHOLDER. Do not apply this as-is to anything that matters.
#
#  These are development credentials, committed so the manifests are complete and
#  applicable. A real cluster uses one of:
#
#    - an External Secrets Operator pulling from Vault / AWS Secrets Manager / GCP SM
#    - Sealed Secrets or SOPS, so the encrypted form is safe to commit
#    - the cloud provider CSI secret driver, mounting secrets as files at runtime
#
#  What is NOT acceptable is a real password in a git repository, base64 or otherwise -
#  base64 is an encoding, not encryption, and `echo ... | base64 -d` is the whole attack.
#  stringData is used here precisely so nobody mistakes the encoding for protection.
# =====================================================================================
apiVersion: v1
kind: Secret
metadata:
  name: oms-db-credentials
  namespace: oms
  labels:
    app.kubernetes.io/part-of: oms-platform
type: Opaque
stringData:
  ORDER_DB_USER: "oms_order"
  ORDER_DB_PASSWORD: "oms_order"
  MARKETDATA_DB_USER: "oms_marketdata"
  MARKETDATA_DB_PASSWORD: "oms_marketdata"
  POSITION_DB_USER: "oms_position"
  POSITION_DB_PASSWORD: "oms_position"
