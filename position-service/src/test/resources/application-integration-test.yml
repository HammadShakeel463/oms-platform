# Testcontainers profile. Connection details come from @ServiceConnection.
spring:
  main:
    # Lets TestSecurityConfig replace the JWKS-fetching decoder. Scoped to this profile on
    # purpose: enabled globally it would let any accidental duplicate bean definition win.
    allow-bean-definition-overriding: true
  jpa:
    hibernate:
      ddl-auto: validate      # the test proves Flyway and the mappings agree
  kafka:
    consumer:
      auto-offset-reset: earliest
    listener:
      missing-topics-fatal: false

oms:
  position:
    trade-consumer-group: position-service-trades-it
    tick-consumer-group: position-service-marks-it

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
    org.apache.kafka: WARN
    com.oms: DEBUG
